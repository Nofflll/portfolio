<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nikita Puchkov — Resume & Portfolio</title>
<style>
  /* Reset & base */
  * { box-sizing: border-box; }
  body {
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #e0f2f1, #fafafa);
    color: #222;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }
  /* Background effects */
  body::before {
    content: "";
    position: fixed;
    top: -10vh; left: -10vw;
    width: 120vw; height: 120vh;
    background: radial-gradient(circle at 20% 20%, rgba(102,187,106,0.15), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(56,142,60,0.15), transparent 30%);
    pointer-events: none;
    z-index: -1;
    transform: translateZ(0);
    transition: transform 0.1s ease-out;
  }
  main {
    max-width: 720px;
    width: 100%;
    background: #fff;
    padding: 2.6rem 3rem 3rem;
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 0 10px rgba(102, 187, 106, 0.2);
    position: relative;
  }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { margin: 0; font-weight: 800; font-size: 2.8rem; color: #2e7d32; }
  header p { margin-top: 0.2rem; font-size: 1.1rem; color: #4a4a4a; }
  
  /* Language Switcher */
  #lang-switcher {
    position: absolute; top: 20px; right: 30px;
    display: flex; gap: 12px;
  }
  #lang-switcher button {
    background: transparent; border: 2px solid #2e7d32;
    color: #2e7d32; font-weight: 600; padding: 6px 14px;
    border-radius: 24px; cursor: pointer;
    transition: background-color 0.3s, color 0.3s;
    font-size: 0.95rem; user-select: none;
  }
  #lang-switcher button.active, #lang-switcher button:hover {
    background-color: #2e7d32; color: white;
  }

  /* Sections */
  section { margin-bottom: 2.8rem; opacity: 0; transform: translateY(25px); animation-fill-mode: forwards; animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); animation-duration: 0.8s; }
  section.visible { opacity: 1; transform: translateY(0); }
  section h2 { font-weight: 700; font-size: 1.6rem; margin-bottom: 0.8rem; border-left: 5px solid #66bb6a; padding-left: 12px; color: #2e7d32; }
  section p, section li { font-size: 1rem; color: #333; }
  section ul { padding-left: 1.25rem; margin-top: 0.6rem; list-style-type: disc; }
  section ul li { margin-bottom: 0.5rem; }

  /* Buttons & Links */
  .btn { background-color: #66bb6a; color: white; border: none; padding: 0.55rem 1.25rem; border-radius: 28px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 9px rgba(102, 187, 106, 0.4); transition: background-color 0.3s ease, box-shadow 0.3s ease; }
  .btn:hover { background-color: #388e3c; box-shadow: 0 6px 15px rgba(56, 142, 60, 0.6); }
  a.resume-link { display: inline-block; margin-top: 1rem; font-weight: 600; color: #2e7d32; text-decoration: none; border-bottom: 2px solid transparent; transition: border-color 0.3s; }
  a.resume-link:hover { border-color: #66bb6a; }
  
  /* Contact Icons */
  #contact-icons { display: flex; justify-content: center; gap: 2.2rem; margin-top: 1rem; }
  #contact-icons a { display: inline-block; width: 36px; height: 36px; filter: brightness(0) saturate(100%) invert(28%) sepia(57%) saturate(458%) hue-rotate(80deg) brightness(98%) contrast(85%); transition: filter 0.3s ease; }
  #contact-icons a:hover { filter: brightness(0) saturate(100%) invert(49%) sepia(76%) saturate(446%) hue-rotate(100deg) brightness(104%) contrast(109%); }
  #contact-icons img { width: 100%; height: 100%; object-fit: contain; }

  /* Project Cards */
  #projects ul { padding: 0; margin: 0; list-style: none; }
  .project-card { background: #f9fff9; border-radius: 14px; margin-bottom: 1.3rem; box-shadow: 0 6px 14px rgba(102, 187, 106, 0.25); transition: box-shadow 0.3s ease, transform 0.3s ease; cursor: pointer; overflow: hidden; user-select: none; }
  .project-card:hover { box-shadow: 0 10px 20px rgba(56, 142, 60, 0.4); transform: translateY(-4px); }
  .project-header { padding: 1rem 1.5rem; font-weight: 700; font-size: 1.2rem; color: #2e7d32; background: #e6f3e8; }
  .project-content { max-height: 0; padding: 0 1.5rem; font-size: 0.95rem; color: #3a3a3a; line-height: 1.4; overflow: hidden; transition: max-height 0.5s ease, padding 0.3s ease; }
  .project-content.open { padding: 1rem 1.5rem 1.5rem; max-height: 500px; }
  .tech-list { margin-top: 0.8rem; font-style: italic; color: #4a7d4a; }
  .btn-group { margin-top: 1rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .btn-link { padding: 0.4rem 1rem; border-radius: 24px; font-weight: 600; text-decoration: none; background: #66bb6a; color: white; box-shadow: 0 4px 9px rgba(102, 187, 106, 0.4); transition: background-color 0.3s ease, box-shadow 0.3s ease; display: inline-flex; align-items: center; gap: 0.4rem; }
  .btn-link:hover { background: #388e3c; box-shadow: 0 6px 15px rgba(56, 142, 60, 0.6); }
  .btn-link svg { width: 18px; height: 18px; fill: white; }

  /* Finland/Relocation Details */
  #relocation-details { margin-top: 1rem; border-left: 4px solid #a5d6a7; padding-left: 14px; color: #2e7d32; font-style: italic; display: none; }

  /* Footer */
  footer { margin-top: 3rem; text-align: center; font-size: 0.9rem; color: #777; }

  /* Responsive */
  @media (max-width: 768px) {
    main { padding: 2rem 1.5rem 2.5rem; }
    header h1 { font-size: 2.2rem; }
    #lang-switcher { top: 15px; right: 15px; gap: 8px; }
    #lang-switcher button { padding: 5px 10px; font-size: 0.85rem; }
  }
</style>
</head>

<script>

      relocationDetails: "Finland represents the ideal environment for my professional growth — combining a cutting-edge tech ecosystem with a deep respect for nature and privacy. I’m actively learning Finnish and preparing to integrate smoothly into the local culture and engineering community."
    },
    fi: {
      about: "Fullstack-kehittäjä, joka rakentaa tuotteita alusta loppuun: ESP32-laitteista sovelluksiin App Storeen ja Google Playyn. Käytän tekoälyn työkaluja (Claude Code, Cursor) kiihdyttämään kehitystä säilyttäen täyden kontrollin arkkitehtuuriin ja laatuun. Kokemusta SaaS:ista, ilmailuohjelmistoinista ja embedded-järjestelmistä.",
      skills: [
        "Taustakehitys: Python, Node.js, REST API, 1C-integraatiot",
        "Edestä: React, TypeScript, Vue",
        "Mobiili: React Native, Expo (App Store & Google Play)",
        "Embedded: ESP32, C++, MicroPython, MQTT, Arduino",
        "Tietokannat: PostgreSQL, MySQL, MongoDB",
        "DevOps: Docker, Linux, Git",
        "AI: LLM-integraatiot (OpenRouter, OpenAI), RAG"
      ],
      projects: [
        {
          title: "SaaS-alustat & AI-tutkinto",
          text: "SaaS-palveluiden kokonaiskehitys. Integroidut tekoälyn verkkosovellukseen automaattiseen testaukseen. Hallinnut tuotteen roadmapia ja teknisiä spesifikaatioita.",
          tech: ["Python", "Node.js", "React", "PostgreSQL", "OpenAI API"],

          demo: null
        },
        {
          title: "Mobiilisovellus (React Native)",
          text: "Rakentanut ristiin alustaisen mobiilisovelluksen prototyypistä julkaisuun App Storeen ja Google Playyn. Hoitanut buildit, testauksen ja julkaisun.",
          tech: ["React Native", "Expo", "TypeScript", "REST API"],

        },
        {
          title: "Embedded IoT (ESP32)",
          text: "Rakentanut firmwaren ESP32-laitteille (C++/MicroPython). Integroidut laitteet backendin kanssa MQTT:n ja REST API:n kautta reaaliaikaiseen tiedonvaihtoon.",
          tech: ["C++", "MicroPython", "MQTT", "ESP32", "Docker"],

        },

        }

      relocation: "Olen avoin etätyölle ja muutolle Eurooppaan (myös Suomeen). Opin aktiivisesti suomea ja ihailen pohjoismaiden teknologian ja luonnon tasapainoa.",

    ru: {
      about: "Инженер-программист полного цикла. Разрабатываю продукты от нуля: от прошивок ESP32 до мобильных приложений в App Store и Google Play. Использую AI-инструменты (Claude Code, Cursor) для ускорения разработки, сохраняя полный контроль над архитектурой и качеством кода. Опыт в SaaS, авиационном ПО и Embedded Systems.",
      skills: [
        "Backend: Python, Node.js, REST API, Интеграции с 1С",
        "Frontend: React, TypeScript, Vue",
        "Mobile: React Native, Expo (App Store & Google Play)",
        "Embedded: ESP32, C++, MicroPython, MQTT, Arduino",
        "Базы данных: PostgreSQL, MySQL, MongoDB",

      ],
      projects: [
        {
          title: "SaaS-платформы & ИИ-экзаменатор",
          text: "Полный цикл разработки SaaS-сервисов. Интеграция LLM в веб-приложение для автоматизированного тестирования. Управление roadmap и техническими спецификациями.",
          tech: ["Python", "Node.js", "React", "PostgreSQL", "OpenAI API"],
          github: "https://github.com/Nofflll",
          demo: null
        },
        {
          title: "Мобильное приложение (React Native)",
          text: "Разработка кроссплатформенного мобильного приложения от прототипа до публикации в App Store и Google Play. Сборка, тестирование, submission.",
          tech: ["React Native", "Expo", "TypeScript", "REST API"],
          github: null,
          demo: null
        },
        {
          title: "Embedded IoT (ESP32)",
          text: "Разработка прошивки для устройств ESP32 (C++/MicroPython). Интеграция устройств с backend по MQTT и REST API для обмена данными в реальном времени.",
          tech: ["C++", "MicroPython", "MQTT", "ESP32", "Docker"],
          github: null,
          demo: null
        },
        {
          title: "Авиационное ПО",
          text: "Разработка ПО для расчёта массы, центровки и лётно-технических характеристик для гражданских реактивных самолётов. Используется в профессиональных рабочих процессах.",
          tech: ["MATLAB", "Python", "Qt", "Авиационные стандарты"],
          github: null,
          demo: null
        }
      ],
      relocation: "Открыт к удалённой работе и релокации в Европу (включая Финляндию). Активно изучаю финский язык и вдохновляюсь балансом технологий и природы в скандинавских странах.",
      relocationDetails: "Финляндия — идеальная среда для профессионального роста, объединяющая передовую технологическую экосистему и глубокое уважение к природе и приватности. Я активно учу финский и готовлюсь к интеграции в местную культуру и инженерное сообщество."
    }
  };

  // Initialize content and language switching
  let currentLang = "en";

  function updateContent(lang) {
    currentLang = lang;
    document.querySelector("#about p").textContent = texts[lang].about;

    const skillsUl = document.querySelector("#skills ul");
    skillsUl.innerHTML = "";
    texts[lang].skills.forEach(skill => {
      const li = document.createElement("li");
      li.textContent = skill;
      skillsUl.appendChild(li);
    });

    // Projects cards rendering
    const projectsUl = document.querySelector("#projects ul");
    projectsUl.innerHTML = "";
    texts[lang].projects.forEach((proj, i) => {
      const li = document.createElement("li");
      li.className = "project-card";
      li.setAttribute("tabindex", 0);
      li.setAttribute("aria-expanded", "false");
      li.setAttribute("role", "button");
      li.setAttribute("aria-controls", `project-details-${i}`);

      li.innerHTML = `
        <div class="project-header">${proj.title}</div>
        <div class="project-content" id="project-details-${i}">
          <p>${proj.text}</p>
          <div class="tech-list"><strong>Technologies:</strong> ${proj.tech.join(", ")}</div>
          <div class="btn-group">
            ${proj.github ? `<a href="${proj.github}" target="_blank" class="btn-link" aria-label="GitHub repository for ${proj.title}">GitHub
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 0.297C5.37 0.297 0 5.67 0 12.3c0 5.29 3.438 9.77 8.205 11.36.6.11.82-.25.82-.56 0-.28-.01-1.02-.015-2-3.338.724-4.042-1.61-4.042-1.61-.547-1.387-1.335-1.76-1.335-1.76-1.09-.745.084-.73.084-.73 1.205.085 1.838 1.23 1.838 1.23 1.07 1.83 2.81 1.3 3.495.993.11-.776.42-1.3.76-1.6-2.665-.3-5.467-1.334-5.467-5.93 0-1.31.47-2.38 1.235-3.22-.123-.3-.535-1.515.117-3.16 0 0 1.005-.32 3.3 1.23a11.47 11.47 0 013.003-.4c1.02.005 2.045.135 3.003.4 2.28-1.55 3.285-1.23 3.285-1.23.655 1.645.243 2.86.12 3.16.77.84 1.235 1.91 1.235 3.22 0 4.6-2.807 5.625-5.48 5.92.43.37.82 1.1.82 2.22 0 1.6-.015 2.88-.015 3.28 0 .31.21.68.825.56C20.565 22.065 24 17.585 24 12.3c0-6.63-5.37-12.003-12-12.003z"></path></svg>
            </a>` : ""}
            ${proj.demo ? `<a href="${proj.demo}" target="_blank" class="btn-link" aria-label="Live demo for ${proj.title}">Demo</a>` : ""}
          </div>
        </div>
      `;

      // Toggle expand on click or enter key
      li.addEventListener("click", () => toggleProject(li));
      li.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleProject(li);
        }
      });

      projectsUl.appendChild(li);
    });

    document.querySelector("#relocation p").textContent = texts[lang].relocation;
    document.querySelector("#relocation-details p").textContent = texts[lang].relocationDetails;

    // Reset relocation details visibility
    const relocationDetails = document.getElementById("relocation-details");
    relocationDetails.style.display = "none";
    document.getElementById("toggle-relocation-btn").setAttribute("aria-expanded", "false");
  }

  function toggleProject(card) {
    const content = card.querySelector(".project-content");
    const expanded = card.getAttribute("aria-expanded") === "true";
    if (expanded) {
      content.classList.remove("open");
      card.setAttribute("aria-expanded", "false");
    } else {
      content.classList.add("open");
      card.setAttribute("aria-expanded", "true");
    }
  }

  // Toggle Relocation details
  document.getElementById("toggle-relocation-btn").addEventListener("click", () => {
    const details = document.getElementById("relocation-details");
    const expanded = details.style.display === "block";
    if (expanded) {
      details.style.display = "none";
      document.getElementById("toggle-relocation-btn").setAttribute("aria-expanded", "false");
      details.setAttribute("aria-hidden", "true");
    } else {
      details.style.display = "block";
      document.getElementById("toggle-relocation-btn").setAttribute("aria-expanded", "true");
      details.setAttribute("aria-hidden", "false");
      details.scrollIntoView({behavior:"smooth"});
    }
  });

  // Language switcher buttons
  document.querySelectorAll("#lang-switcher button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("active")) return;
      document.querySelectorAll("#lang-switcher button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateContent(btn.dataset.lang);
    });
  });

  // Parallax subtle background movement on mousemove
  document.body.addEventListener("mousemove", e => {
    const amountX = (e.clientX / window.innerWidth - 0.5) * 8;
    const amountY = (e.clientY / window.innerHeight - 0.5) * 8;
    document.body.style.setProperty("--parallax-x", amountX + "px");
    document.body.style.setProperty("--parallax-y", amountY + "px");
  });

  // Initial content load
  updateContent(currentLang);

  // Animate sections on scroll
  const sections = document.querySelectorAll("section");
  function revealSections() {
    const triggerBottom = window.innerHeight * 0.85;
    sections.forEach(section => {
      const top = section.getBoundingClientRect().top;
      if (top < triggerBottom) {
        section.classList.add("visible");
      }
    });
  }
  window.addEventListener("scroll", revealSections);
  revealSections();
</script>

<style>
  body::before {
    transform: translate(calc(var(--parallax-x, 0px)), calc(var(--parallax-y, 0px)));
  }
</style>

</body>
</html>
